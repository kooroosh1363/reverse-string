[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reverse-string-lab"
version = "2.0.0"
description = "A small, tested Python lab for character and word reversal."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Peyman Raad" }]
dependencies = []

[project.scripts]
reverse-string = "reverse_string.cli:main"

[tool.setuptools.packages.find]
include = ["reverse_string*"]
